name: "text-compare"

services:

  # nginx server
  nginx-server:
    image: nginx:stable
    container_name: nginx-server
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    restart: unless-stopped
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/log:/var/log/nginx
      - ./app:/var/www/app
    networks:
      - local-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      - php

  # php-fmp
  php:
    build:
      context: php
      dockerfile: Dockerfile
    container_name: php
    restart: unless-stopped
    working_dir: /var/www/app
    volumes:
      - ./app:/var/www/app
      - ./php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./php/log:/var/log/php
    networks:
      - local-network

networks:
  local-network:
    driver: bridge